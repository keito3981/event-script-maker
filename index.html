<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>イベント台本メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1 class="app-title"><span class="logo" aria-hidden="true">台</span>イベント台本メーカー</h1>
  <nav class="app-nav" aria-label="ページ切替">
    <a href="index.html" aria-current="page">台本エディタ</a>
    <a href="taikai.html">ぼーっとする大会</a>
    <a href="race.html">ラクじゃないレース</a>
  </nav>
  <span class="save-status" id="saveStatus" role="status" aria-live="polite"></span>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="台本一覧">
    <button class="btn btn-primary" id="newBtn">＋ 新しい台本</button>
    <h2 class="side-heading">台本一覧</h2>
    <ul class="script-list" id="scriptList"></ul>
    <div class="side-footer">
      <button class="btn btn-tertiary btn-sm" id="importBtn">ファイルから読み込む</button>
      <input type="file" id="importFile" accept=".json,application/json" class="visually-hidden" tabindex="-1">
      <p class="hint">データはこのブラウザ内に自動保存されます。ほかの人には「共有リンクを発行」で共有できます。</p>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" hidden>元に戻す</button></div>

<dialog id="shareDlg">
  <h2>共有リンクを発行しました</h2>
  <p>リンクはクリップボードにコピー済みです。開いた人は閲覧とPDFダウンロードができ、「自分の台本に追加」で編集もできます。</p>
  <div class="field"><label for="shareUrl">共有リンク</label><input class="input" id="shareUrl" readonly></div>
  <p class="hint">リンクには発行した時点の内容が入っています。内容を直したら、もう一度発行してください。</p>
  <div class="actions">
    <button class="btn btn-secondary" id="shareCopy">もう一度コピー</button>
    <button class="btn btn-primary" id="shareClose">閉じる</button>
  </div>
</dialog>

<dialog id="confirmDlg">
  <h2 id="confirmTitle">確認</h2>
  <p id="confirmMsg"></p>
  <div class="actions">
    <button class="btn btn-secondary" value="cancel" id="confirmCancel">キャンセル</button>
    <button class="btn btn-primary" id="confirmOk">削除する</button>
  </div>
</dialog>

<script src="share.js"></script>
<script>
(() => {
'use strict';

const STORE_KEY = 'event-script-maker:v1';
const TYPES = [
  {v:'progress', label:'進行'},
  {v:'mc',       label:'MC'},
  {v:'talk',     label:'登壇・挨拶'},
  {v:'show',     label:'演出'},
  {v:'break',    label:'休憩・転換'},
  {v:'other',    label:'その他'},
];
const typeLabel = v => (TYPES.find(t => t.v === v) || TYPES[5]).label;

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const seg = (type, title, dur, extra = {}) => ({id:uid(), type, title, dur, speaker:'', line:'', sound:'', light:'', video:'', note:'', ...extra});

const TEMPLATES = {
  blank: {
    name:'空の台本', desc:'ゼロから組み立てる',
    rows: () => [seg('progress','開演', 5)],
  },
  ceremony: {
    name:'セミナー・式典', desc:'開会挨拶〜登壇〜閉会の基本構成',
    rows: () => [
      seg('show','開場・客入れ', 30, {sound:'客入れBGM', light:'客電100%', video:'待機スライド'}),
      seg('mc','開演アナウンス', 3, {speaker:'MC', line:'皆さま、本日はお忙しい中お越しいただき、誠にありがとうございます。\nまもなく開演いたします。', sound:'BGM F.O.', light:'客電ダウン'}),
      seg('talk','主催者挨拶', 5, {speaker:'主催者', video:'タイトルスライド'}),
      seg('talk','基調講演', 40, {speaker:'登壇者', video:'登壇者PC切替'}),
      seg('break','休憩', 10, {sound:'休憩BGM', light:'客電50%'}),
      seg('talk','パネルディスカッション', 40, {speaker:'モデレーター／パネリスト'}),
      seg('mc','閉会挨拶・アナウンス', 5, {speaker:'MC', line:'以上をもちまして、本日のプログラムはすべて終了となります。'}),
      seg('show','客出し', 15, {sound:'客出しBGM', light:'客電100%'}),
    ],
  },
  competition: {
    name:'大会・競技イベント', desc:'ルール説明〜競技〜表彰の構成',
    rows: () => [
      seg('show','開場・受付', 30, {sound:'客入れBGM'}),
      seg('mc','オープニング', 5, {speaker:'MC', line:'お待たせいたしました！ただいまより大会を開催いたします！', sound:'OP SE → BGM', light:'ステージ明転'}),
      seg('mc','ルール説明', 5, {speaker:'MC', video:'ルールスライド'}),
      seg('progress','競技', 60, {note:'計測スタッフ配置'}),
      seg('break','集計・転換', 15, {sound:'転換BGM'}),
      seg('show','結果発表・表彰式', 15, {speaker:'MC／プレゼンター', sound:'ドラムロール→ファンファーレ', light:'スポット'}),
      seg('mc','クロージング', 5, {speaker:'MC'}),
    ],
  },
};

/* ---------- 状態 ---------- */
let state = load();
let view = 'edit';
let shared = null;   // 共有リンクで開いたときの台本
let openBodies = new Set();
let undoFn = null;

function load(){
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && Array.isArray(d.scripts)) return d;
  } catch(e) {}
  return {scripts:[], currentId:null};
}
let saveTimer;
function save(immediate){
  clearTimeout(saveTimer);
  const run = () => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      setStatus('保存しました ' + new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));
    } catch(e) { setStatus('保存できませんでした（ブラウザの設定をご確認ください）'); }
  };
  setStatus('保存中…');
  immediate ? run() : (saveTimer = setTimeout(run, 400));
}
const setStatus = t => document.getElementById('saveStatus').textContent = t;
const current = () => state.scripts.find(s => s.id === state.currentId) || null;
const touch = s => { s.updatedAt = Date.now(); };

/* ---------- 時間計算 ---------- */
function toSec(hhmm){
  const m = /^(\d{1,2}):(\d{2})/.exec(hhmm || '');
  return m ? (+m[1]) * 3600 + (+m[2]) * 60 : 0;
}
function fmt(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600) % 24, m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2,'0');
  return `${p(h)}:${p(m)}` + (s ? `:${p(s)}` : '');
}
function fmtDur(min){
  const total = Math.round(min * 60);
  const h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), s = total % 60;
  return (h ? `${h}時間` : '') + (m || (!h && !s) ? `${m}分` : '') + (s ? `${s}秒` : '');
}
function timeline(s){
  let t = toSec(s.startTime);
  return s.rows.map(r => { const start = t; t += (Number(r.dur) || 0) * 60; return {start, end:t}; });
}

/* ---------- 台本操作 ---------- */
function createScript(tplKey){
  const tpl = TEMPLATES[tplKey];
  const s = {
    id:uid(), title: tplKey === 'blank' ? '新しい台本' : tpl.name + '（台本）',
    date:'', venue:'', startTime:'13:00', staff:'', memo:'',
    rows: tpl.rows(), updatedAt: Date.now(),
  };
  state.scripts.unshift(s);
  view = 'edit';
  openScript(s.id);
  setTimeout(() => document.getElementById('f-title')?.select(), 0);
}

/* 作成画面（テンプレート選択）と台本の行き来。ブラウザの「戻る」でも作成画面に戻れる */
function openScript(id){
  const fromHome = !current();
  leaveShared();
  state.currentId = id; save(true);
  if (fromHome) history.pushState({view:'edit', id}, '');
  render(); scrollTo(0, 0);
}
function goHome(){
  if (history.state?.view === 'edit') return history.back();
  leaveShared(); state.currentId = null; save(true); render(); scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  if (shared) return;
  const id = e.state?.view === 'edit' ? e.state.id : null;
  state.currentId = id && state.scripts.some(x => x.id === id) ? id : null;
  save(true); render();
});

/* ---------- 描画 ---------- */
const $main = document.getElementById('main');

function render(){
  renderList();
  if (shared) return renderShared();
  const s = current();
  if (!s) return renderEmpty();
  $main.innerHTML = `
    <div class="no-print" style="margin-bottom:16px">
      <button class="btn btn-secondary btn-sm" data-act="home">← 新しい台本の作成画面へ</button>
    </div>
    <div class="toolbar no-print">
      <div class="tabs" role="tablist" aria-label="表示切替">
        <button class="tab" role="tab" aria-selected="${view==='edit'}" data-view="edit">編集</button>
        <button class="tab" role="tab" aria-selected="${view==='preview'}" data-view="preview">台本プレビュー</button>
      </div>
      <span class="spacer"></span>
      <div class="btn-group">
        <button class="btn btn-primary btn-sm" data-act="share">共有リンクを発行</button>
        <button class="btn btn-secondary btn-sm" data-act="pdf">PDFダウンロード</button>
        <button class="btn btn-secondary btn-sm" data-act="print">印刷</button>
        <button class="btn btn-secondary btn-sm" data-act="csv">Excel用CSV</button>
        <button class="btn btn-secondary btn-sm" data-act="export">ファイルに保存</button>
        <button class="btn btn-tertiary btn-sm" data-act="dup-script">台本を複製</button>
        <button class="btn btn-danger btn-sm" data-act="del-script">台本を削除</button>
      </div>
    </div>
    ${view === 'edit' ? editHTML(s) : previewHTML(s)}
  `;
  if (view === 'edit') bindDrag();
}

function renderList(){
  const ul = document.getElementById('scriptList');
  if (!state.scripts.length){ ul.innerHTML = '<li class="hint">まだ台本がありません</li>'; return; }
  ul.innerHTML = state.scripts.map(s => `
    <li><button class="script-item" data-open="${s.id}" aria-current="${s.id===state.currentId}">
      <span class="si-title">${esc(s.title || '無題の台本')}</span>
      <span class="si-meta">${esc(s.date || '日付未定')}・${s.rows.length}項目</span>
    </button></li>`).join('');
}

function renderShared(){
  $main.innerHTML = `
    <div class="shared-banner no-print">
      <div><strong>共有された台本です（閲覧用）</strong><span class="hint">「自分の台本に追加」すると、このブラウザで編集できます。</span></div>
      <div class="btn-group">
        <button class="btn btn-primary btn-sm" data-act="pdf">PDFダウンロード</button>
        <button class="btn btn-secondary btn-sm" data-act="import-shared">自分の台本に追加</button>
      </div>
    </div>
    ${previewHTML(shared)}`;
}

function renderEmpty(){
  $main.innerHTML = `
    <div class="empty">
      <h2>台本をつくりましょう</h2>
      <p>テンプレートを選ぶと、よくある進行があらかじめ入った状態で始められます。</p>
      <div class="template-grid">
        ${Object.entries(TEMPLATES).map(([k,t]) => `
          <button class="template-card" data-tpl="${k}"><strong>${esc(t.name)}</strong><span>${esc(t.desc)}</span></button>`).join('')}
        <a class="template-card" href="taikai.html" style="text-decoration:none"><strong>ぼーっとする大会</strong><span>定型の台詞はそのまま、変わる部分だけ入力して作る専用ページへ</span></a>
        <a class="template-card" href="race.html" style="text-decoration:none"><strong>ラクじゃないレース</strong><span>物流業界の競技大会。競技・スポンサー・賞品を入力して作る専用ページへ</span></a>
      </div>
    </div>`;
}

function editHTML(s){
  const tl = timeline(s);
  const total = s.rows.reduce((a,r) => a + (Number(r.dur)||0), 0);
  return `
  <section class="card" aria-labelledby="meta-h">
    <h2 id="meta-h" class="visually-hidden">基本情報</h2>
    <div class="grid grid-4">
      <div class="field span-all"><label for="f-title">イベント名</label><input class="input" id="f-title" data-meta="title" value="${esc(s.title)}"></div>
      <div class="field"><label for="f-date">開催日</label><input class="input" type="date" id="f-date" data-meta="date" value="${esc(s.date)}"></div>
      <div class="field"><label for="f-start">開始時刻</label><input class="input" type="time" id="f-start" data-meta="startTime" value="${esc(s.startTime)}"></div>
      <div class="field"><label for="f-staff">作成者</label><input class="input" id="f-staff" data-meta="staff" value="${esc(s.staff)}"></div>
    </div>
    <div class="grid grid-2" style="margin-top:16px">
      <div class="field"><label for="f-venue">会場</label><input class="input" id="f-venue" data-meta="venue" value="${esc(s.venue)}"></div>
      <div class="field"><label for="f-memo">全体メモ（注意事項・連絡先など）</label><textarea class="textarea" id="f-memo" data-meta="memo" rows="2" style="min-height:48px">${esc(s.memo)}</textarea></div>
    </div>
  </section>

  <dl class="summary" id="summary">
    <div><dt>開始</dt><dd>${fmt(toSec(s.startTime))}</dd></div>
    <div><dt>終了予定</dt><dd id="sum-end">${fmt(toSec(s.startTime) + total*60)}</dd></div>
    <div><dt>総尺</dt><dd id="sum-total">${fmtDur(total)}</dd></div>
    <div><dt>項目数</dt><dd>${s.rows.length}</dd></div>
  </dl>

  <h2 class="visually-hidden">進行表</h2>
  <ol class="seg-list" id="segList">
    ${s.rows.map((r,i) => segHTML(r, i, tl[i], s.rows.length)).join('')}
  </ol>
  <div class="add-row">
    <button class="btn btn-primary" data-act="add">＋ 項目を追加</button>
    <button class="btn btn-tertiary" data-act="expand-all">${openBodies.size ? 'すべて閉じる' : 'すべての詳細を開く'}</button>
  </div>
  <p class="hint" style="margin-top:12px">ヒント：左端の「⋮⋮」をドラッグして並べ替えできます。時刻は開始時刻と各項目の尺から自動で計算されます。</p>`;
}

function segHTML(r, i, t, n){
  const open = openBodies.has(r.id);
  const hasDetail = r.line || r.sound || r.light || r.video || r.note;
  return `
  <li class="seg t-${r.type}" data-id="${r.id}">
    <div class="seg-head">
      <button class="drag-handle" draggable="true" aria-label="ドラッグして並べ替え" title="ドラッグして並べ替え" tabindex="-1">⋮⋮</button>
      <div class="seg-time" data-time>${fmt(t.start)}<small>〜${fmt(t.end)}</small></div>
      <select class="select input-sm type-sel" data-f="type" aria-label="区分">
        ${TYPES.map(tp => `<option value="${tp.v}" ${tp.v===r.type?'selected':''}>${tp.label}</option>`).join('')}
      </select>
      <input class="input input-sm title-in" data-f="title" value="${esc(r.title)}" placeholder="項目名（例：開会挨拶）" aria-label="項目名">
      <div class="dur-wrap"><input class="input input-sm" type="number" min="0" step="0.5" data-f="dur" value="${esc(r.dur)}" aria-label="尺（分）"><span>分</span></div>
      <div class="seg-actions">
        <button class="btn-icon" data-act="up" aria-label="上へ移動" title="上へ" ${i===0?'disabled':''}>↑</button>
        <button class="btn-icon" data-act="down" aria-label="下へ移動" title="下へ" ${i===n-1?'disabled':''}>↓</button>
        <button class="btn-icon" data-act="insert" aria-label="この下に項目を追加" title="この下に追加">＋</button>
        <button class="btn-icon" data-act="dup" aria-label="複製" title="複製">⧉</button>
        <button class="btn-icon" data-act="del" aria-label="削除" title="削除" style="color:var(--red-900)">✕</button>
      </div>
    </div>
    <button class="toggle-body" data-act="toggle" aria-expanded="${open}">${open ? '▲ 詳細を閉じる' : '▼ 台詞・演出キューを' + (hasDetail ? '見る' : '書く')}${!open && hasDetail ? '（入力あり）' : ''}</button>
    <div class="seg-body" ${open ? '' : 'hidden'}>
      <div class="field"><label>話者・担当</label><input class="input input-sm" data-f="speaker" value="${esc(r.speaker)}" placeholder="例：MC 山田"></div>
      <div class="field"><label>台詞・進行内容</label><textarea class="textarea" data-f="line" rows="4" placeholder="読み上げる台詞や進行の流れを書きます">${esc(r.line)}</textarea></div>
      <div class="cue-grid">
        <div class="field"><label>音響</label><textarea class="textarea" style="min-height:64px" data-f="sound" rows="2" placeholder="BGM・SE・マイク">${esc(r.sound)}</textarea></div>
        <div class="field"><label>照明</label><textarea class="textarea" style="min-height:64px" data-f="light" rows="2" placeholder="明転・暗転・スポット">${esc(r.light)}</textarea></div>
        <div class="field"><label>映像</label><textarea class="textarea" style="min-height:64px" data-f="video" rows="2" placeholder="スライド・VTR">${esc(r.video)}</textarea></div>
        <div class="field"><label>備考・スタッフ</label><textarea class="textarea" style="min-height:64px" data-f="note" rows="2" placeholder="動線・小道具など">${esc(r.note)}</textarea></div>
      </div>
    </div>
  </li>`;
}

function previewHTML(s, {split = false} = {}){
  const tl = timeline(s);
  const total = s.rows.reduce((a,r) => a + (Number(r.dur)||0), 0);
  const meta = [
    s.date && `開催日：${esc(s.date)}`,
    s.venue && `会場：${esc(s.venue)}`,
    `時間：${fmt(toSec(s.startTime))}〜${fmt(toSec(s.startTime)+total*60)}（${fmtDur(total)}）`,
    s.staff && `作成：${esc(s.staff)}`,
  ].filter(Boolean).map(x => `<span>${x}</span>`).join('');
  const cue = r => [['音響',r.sound],['照明',r.light],['映像',r.video],['備考',r.note]]
    .filter(([,v]) => v).map(([k,v]) => `<div><b>${k}</b>${esc(v)}</div>`).join('');
  return `
  <article class="preview">
    <header class="pv-head"><h2>${esc(s.title || '無題の台本')}</h2><div class="pv-meta">${meta}</div></header>
    ${s.memo ? `<div class="pv-memo">${esc(s.memo)}</div>` : ''}
    <div class="preview-wrap"><table class="pv-table">
      <thead><tr><th style="width:90px">時刻</th><th style="width:60px">尺</th><th>内容・台詞</th><th style="width:30%">演出キュー</th></tr></thead>
      <tbody>
      ${s.rows.map((r,i) => {
        const paras = split ? String(r.line || '').split(/\n{2,}/).filter(p => p.trim()) : [r.line].filter(Boolean);
        const brk = r.type === 'break' ? ' pv-break' : '';
        const first = `
        <tr class="${brk}${paras.length > 1 ? ' c-head' : ''}">
          <td class="pv-time">${fmt(tl[i].start)}</td>
          <td>${fmtDur(Number(r.dur)||0)}</td>
          <td>
            <div class="pv-title"><span class="tag t-${r.type}">${typeLabel(r.type)}</span>${esc(r.title)}</div>
            ${r.speaker ? `<div class="pv-speaker">話者：${esc(r.speaker)}</div>` : ''}
            ${paras[0] ? `<div class="pv-line">${esc(paras[0])}</div>` : ''}
          </td>
          <td class="pv-cue">${cue(r)}</td>
        </tr>`;
        /* PDF用：台詞を段落ごとの行に分け、ページをまたいでも行の途中で切れないようにする */
        return first + paras.slice(1).map((p, j) => `
        <tr class="c-cont${brk}${j < paras.length - 2 ? ' c-head' : ''}"><td></td><td></td><td><div class="pv-line">${esc(p)}</div></td><td></td></tr>`).join('');
      }).join('')}
      </tbody>
    </table></div>
  </article>`;
}

/* 入力中は再描画せず、時刻とサマリーだけ更新（フォーカスを失わないため） */
function refreshTimes(){
  const s = current(); if (!s) return;
  const tl = timeline(s);
  document.querySelectorAll('.seg').forEach((el, i) => {
    const t = tl[i]; if (!t) return;
    el.querySelector('[data-time]').innerHTML = `${fmt(t.start)}<small>〜${fmt(t.end)}</small>`;
  });
  const total = s.rows.reduce((a,r) => a + (Number(r.dur)||0), 0);
  const end = document.getElementById('sum-end'), tot = document.getElementById('sum-total');
  if (end) end.textContent = fmt(toSec(s.startTime) + total*60);
  if (tot) tot.textContent = fmtDur(total);
  const startDd = document.querySelector('#summary dd');
  if (startDd) startDd.textContent = fmt(toSec(s.startTime));
}

/* ---------- イベント ---------- */
document.addEventListener('input', e => {
  const s = current(); if (!s) return;
  const t = e.target;
  if (t.dataset.meta){
    s[t.dataset.meta] = t.value; touch(s); save();
    if (t.dataset.meta === 'startTime') refreshTimes();
    if (t.dataset.meta === 'title' || t.dataset.meta === 'date') renderList();
    return;
  }
  const f = t.dataset.f; if (!f) return;
  const li = t.closest('.seg'); const r = s.rows.find(x => x.id === li.dataset.id); if (!r) return;
  r[f] = f === 'dur' ? (t.value === '' ? '' : Math.max(0, Number(t.value))) : t.value;
  touch(s); save();
  if (f === 'dur') refreshTimes();
  if (f === 'type') li.className = `seg t-${t.value}`;
});

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;

  if (b.id === 'newBtn' || b.dataset.act === 'home'){ goHome(); return; }
  if (b.id === 'shareClose'){ document.getElementById('shareDlg').close(); return; }
  if (b.id === 'shareCopy'){ await Share.copy(document.getElementById('shareUrl').value); toast('コピーしました'); return; }
  if (b.id === 'importBtn'){ document.getElementById('importFile').click(); return; }
  if (b.id === 'toastUndo'){ undoFn && undoFn(); hideToast(); return; }
  if (b.dataset.tpl){ createScript(b.dataset.tpl); return; }
  if (b.dataset.open){ openScript(b.dataset.open); return; }
  if (b.dataset.view){ view = b.dataset.view; render(); return; }

  if (b.dataset.act === 'pdf'){
    const target = shared || current(); if (!target) return;
    b.disabled = true; const label = b.textContent; b.textContent = 'PDFを作成中…';
    try {
      const tmp = document.createElement('div'); tmp.innerHTML = previewHTML(target, {split:true});
      await Share.pdf(tmp.firstElementChild, `${safeName(target)}.pdf`);
      toast('PDFをダウンロードしました');
    } catch(err){ toast('PDFを作れませんでした。通信状況を確認するか、「印刷」からPDF保存してください'); }
    finally { b.disabled = false; b.textContent = label; }
    return;
  }
  if (b.dataset.act === 'import-shared'){
    const c = JSON.parse(JSON.stringify(shared));
    c.id = uid(); c.rows.forEach(r => r.id = uid()); c.updatedAt = Date.now();
    state.scripts.unshift(c); state.currentId = c.id; leaveShared(); view = 'edit';
    save(true); render(); toast('自分の台本に追加しました'); return;
  }

  const s = current(); if (!s) return;
  const act = b.dataset.act; if (!act) return;
  const li = b.closest('.seg');
  const idx = li ? s.rows.findIndex(r => r.id === li.dataset.id) : -1;

  switch (act){
    case 'add': {
      const r = seg('progress','', 5); s.rows.push(r); openBodies.add(r.id);
      commit(s); focusRow(r.id); break;
    }
    case 'insert': {
      const r = seg(s.rows[idx].type,'', 5); s.rows.splice(idx+1, 0, r);
      commit(s); focusRow(r.id); break;
    }
    case 'dup': {
      const r = {...s.rows[idx], id:uid()}; s.rows.splice(idx+1, 0, r);
      commit(s); toast('項目を複製しました'); break;
    }
    case 'del': {
      const [removed] = s.rows.splice(idx, 1);
      commit(s);
      toast(`「${removed.title || '無題の項目'}」を削除しました`, () => { s.rows.splice(idx, 0, removed); commit(s); });
      break;
    }
    case 'up': case 'down': {
      const j = act === 'up' ? idx-1 : idx+1;
      if (j < 0 || j >= s.rows.length) break;
      [s.rows[idx], s.rows[j]] = [s.rows[j], s.rows[idx]];
      const id = s.rows[j].id; commit(s);
      document.querySelector(`.seg[data-id="${id}"] [data-act="${act}"]:not(:disabled)`)?.focus();
      break;
    }
    case 'toggle': {
      const id = li.dataset.id;
      openBodies.has(id) ? openBodies.delete(id) : openBodies.add(id);
      render(); document.querySelector(`.seg[data-id="${id}"] [data-act="toggle"]`)?.focus(); break;
    }
    case 'expand-all': {
      if (openBodies.size) openBodies.clear(); else s.rows.forEach(r => openBodies.add(r.id));
      render(); break;
    }
    case 'print': {
      if (view !== 'preview'){ view = 'preview'; render(); }
      setTimeout(() => window.print(), 50); break;
    }
    case 'share': {
      const {id, updatedAt, ...rest} = s;
      const url = await Share.makeLink('s', {...rest, rows:s.rows.map(({id, ...r}) => r)});
      const ok = await Share.copy(url);
      document.getElementById('shareUrl').value = url;
      document.getElementById('shareDlg').showModal();
      document.getElementById('shareUrl').select();
      if (!ok) toast('自動でコピーできませんでした。表示されたリンクをコピーしてください');
      break;
    }
    case 'csv': exportCSV(s); break;
    case 'export': exportJSON(s); break;
    case 'dup-script': {
      const c = JSON.parse(JSON.stringify(s));
      c.id = uid(); c.title = s.title + '（コピー）'; c.rows.forEach(r => r.id = uid()); c.updatedAt = Date.now();
      state.scripts.unshift(c); state.currentId = c.id; save(true); render(); toast('台本を複製しました'); break;
    }
    case 'del-script': {
      const ok = await confirmDlg('台本を削除しますか？', `「${s.title || '無題の台本'}」を削除します。削除後しばらくは「元に戻す」で復元できます。`);
      if (!ok) break;
      const pos = state.scripts.indexOf(s);
      state.scripts.splice(pos, 1);
      state.currentId = state.scripts[0]?.id || null;
      save(true); render();
      toast('台本を削除しました', () => { state.scripts.splice(pos, 0, s); state.currentId = s.id; save(true); render(); });
      break;
    }
  }
});

function commit(s){ touch(s); save(true); render(); }
function focusRow(id){
  const el = document.querySelector(`.seg[data-id="${id}"] [data-f="title"]`);
  if (el){ el.focus(); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}

/* ドラッグで並べ替え */
function bindDrag(){
  const list = document.getElementById('segList'); if (!list) return;
  let dragId = null;
  list.querySelectorAll('.drag-handle').forEach(h => {
    h.addEventListener('dragstart', e => {
      const li = h.closest('.seg'); dragId = li.dataset.id; li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
      e.dataTransfer.setDragImage(li, 20, 20);
    });
    h.addEventListener('dragend', () => { dragId = null; render(); });
  });
  list.querySelectorAll('.seg').forEach(li => {
    li.addEventListener('dragover', e => {
      if (!dragId) return; e.preventDefault();
      const after = e.clientY > li.getBoundingClientRect().top + li.offsetHeight / 2;
      list.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before','drop-after'));
      li.classList.add(after ? 'drop-after' : 'drop-before');
    });
    li.addEventListener('drop', e => {
      e.preventDefault(); const s = current(); if (!s || !dragId || dragId === li.dataset.id) return;
      const after = li.classList.contains('drop-after');
      const from = s.rows.findIndex(r => r.id === dragId);
      const [moved] = s.rows.splice(from, 1);
      let to = s.rows.findIndex(r => r.id === li.dataset.id) + (after ? 1 : 0);
      s.rows.splice(to, 0, moved);
      dragId = null; commit(s);
    });
  });
}

/* ---------- 書き出し・読み込み ---------- */
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
}
const safeName = s => (s.title || '台本').replace(/[\\/:*?"<>|]/g, '_');

function exportJSON(s){
  download(`${safeName(s)}.json`, JSON.stringify({app:'event-script-maker', version:1, script:s}, null, 2), 'application/json');
  toast('共有用ファイルを書き出しました。相手は「ファイルから読み込む」で開けます');
}
function exportCSV(s){
  const tl = timeline(s);
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const head = ['No','開始','終了','尺(分)','区分','項目','話者・担当','台詞・進行内容','音響','照明','映像','備考'];
  const lines = [head.map(q).join(',')].concat(s.rows.map((r,i) =>
    [i+1, fmt(tl[i].start), fmt(tl[i].end), r.dur, typeLabel(r.type), r.title, r.speaker, r.line, r.sound, r.light, r.video, r.note].map(q).join(',')));
  download(`${safeName(s)}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
  toast('CSVを書き出しました（Excelでそのまま開けます）');
}
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    const s = d.script || d;
    if (!Array.isArray(s.rows)) throw new Error();
    s.id = uid(); s.rows.forEach(r => r.id = uid()); s.updatedAt = Date.now();
    state.scripts.unshift(s); state.currentId = s.id; view = 'edit';
    save(true); render(); toast(`「${s.title}」を読み込みました`);
  } catch(err) { toast('このファイルは読み込めませんでした。書き出した .json ファイルを選んでください'); }
});

/* ---------- トースト・ダイアログ ---------- */
let toastTimer;
function toast(msg, undo){
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  const ub = document.getElementById('toastUndo');
  undoFn = undo || null; ub.hidden = !undo;
  el.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 8000 : 3500);
}
function hideToast(){ document.getElementById('toast').hidden = true; undoFn = null; }

function confirmDlg(title, msg){
  const d = document.getElementById('confirmDlg');
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  return new Promise(res => {
    const done = v => { d.close(); ok.onclick = cancel.onclick = null; res(v); };
    const ok = document.getElementById('confirmOk'), cancel = document.getElementById('confirmCancel');
    ok.onclick = () => done(true); cancel.onclick = () => done(false);
    d.oncancel = () => res(false);
    d.showModal(); cancel.focus();
  });
}

/* キーボードショートカット：Ctrl/⌘+P で台本印刷 */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'p' && current() && view !== 'preview'){
    e.preventDefault(); view = 'preview'; render(); setTimeout(() => window.print(), 50);
  }
});

function leaveShared(){
  if (!shared) return;
  shared = null; history.replaceState(null, '', location.pathname);
}
window.addEventListener('hashchange', () => { if (location.hash.startsWith('#s=')) location.reload(); });

(async () => {
  const data = await Share.readLink('s');
  if (data === undefined) toast('共有リンクを読み込めませんでした。リンクが途中で切れていないか確認してください');
  if (data && Array.isArray(data.rows)){
    shared = {...data, id:'shared', rows:data.rows.map(r => ({...r, id:uid()}))};
    document.title = (shared.title || '台本') + '｜共有された台本';
  }
  if (!state.currentId && state.scripts[0]) state.currentId = state.scripts[0].id;
  render();
})();
})();
